<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Liaison System</title>
    
    <!-- ============================================================ -->
    <!-- PWA / INSTALLATION META TAGS -->
    <!-- ============================================================ -->
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#6366f1">
    
    <!-- iOS Safari meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Liaison">
    
    <!-- iOS Safari icons -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">
    
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#6366f1">
    <meta name="msapplication-TileImage" content="icons/icon-144x144.png">
    
    <!-- ============================================================ -->
    <!-- STYLES & SCRIPTS -->
    <!-- ============================================================ -->
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
        }
        .toast {
            transition: all 0.3s ease;
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center gradient-bg p-4">

    <!-- ========== LOGIN CARD ========== -->
    <div class="w-full max-w-md">
        <div class="login-card rounded-2xl shadow-2xl p-8 md:p-10">
            
            <!-- Logo / Header -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-handshake text-4xl text-indigo-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Liaison</h1>
                <p class="text-sm text-slate-500 mt-1">Monitoring &amp; Record System</p>
                <div class="mt-2 text-xs text-slate-400 border-t border-slate-200 pt-2">
                    <i class="fas fa-building mr-1"></i>
                    BEPO-PESO
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5" autocomplete="off">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
                        <i class="fas fa-user mr-2 text-indigo-500"></i>Username
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            placeholder="Enter your username" 
                            class="w-full px-4 py-3 pl-11 border border-slate-300 rounded-xl focus:outline-none input-focus transition-colors"
                            autocomplete="off"
                            required
                        />
                        <i class="fas fa-user absolute left-3 top-3.5 text-slate-400"></i>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
                        <i class="fas fa-lock mr-2 text-indigo-500"></i>Password
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Enter your password" 
                            class="w-full px-4 py-3 pl-11 border border-slate-300 rounded-xl focus:outline-none input-focus transition-colors"
                            required
                        />
                        <i class="fas fa-lock absolute left-3 top-3.5 text-slate-400"></i>
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-3 top-3 text-slate-400 hover:text-slate-600 transition-colors"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500" />
                        Remember me
                    </label>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-indigo-200 transition-all duration-200 flex items-center justify-center gap-2"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden text-red-500 text-sm text-center bg-red-50 rounded-lg p-3 border border-red-200">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    Invalid username or password. Please try again.
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-white/70 text-sm">
            <p>© 2026 BEPO-PESO. All rights reserved.</p>
        </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i id="toastIcon" class="fas fa-check-circle text-green-400"></i>
        <span id="toastMessage">Login successful</span>
    </div>

    <!-- ========== INSTALLATION SCRIPTS ========== -->
    <script src="installer.js"></script>

    <script>
        (function() {
            // ---------- CREDENTIALS ----------
            const VALID_USERNAME = 'admin';
            const VALID_PASSWORD = 'admin123';

            // DOM refs
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const togglePassword = document.getElementById('togglePassword');
            const rememberMe = document.getElementById('rememberMe');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // ---------- TOAST ----------
            let toastTimeout = null;

            function showToast(msg, type = 'success') {
                toastMessage.textContent = msg;
                toastIcon.className = type === 'success' ? 'fas fa-check-circle text-green-400' :
                    'fas fa-exclamation-circle text-red-400';
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            // ---------- TOGGLE PASSWORD VISIBILITY ----------
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });

            // ---------- REMEMBER ME ----------
            // Load saved credentials
            if (localStorage.getItem('rememberedUsername')) {
                usernameInput.value = localStorage.getItem('rememberedUsername');
                passwordInput.value = localStorage.getItem('rememberedPassword');
                rememberMe.checked = true;
            }

            // ---------- LOGIN HANDLER ----------
            function handleLogin(e) {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // Validate credentials
                if (username === VALID_USERNAME && password === VALID_PASSWORD) {
                    // Success
                    errorMessage.classList.add('hidden');
                    
                    // Save remember me
                    if (rememberMe.checked) {
                        localStorage.setItem('rememberedUsername', username);
                        localStorage.setItem('rememberedPassword', password);
                    } else {
                        localStorage.removeItem('rememberedUsername');
                        localStorage.removeItem('rememberedPassword');
                    }

                    // Show success toast
                    showToast('Login successful! Redirecting...', 'success');

                    // Disable button briefly
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirecting...';

                    // Redirect to index.html
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);

                } else {
                    // Failed login
                    errorMessage.classList.remove('hidden');
                    errorMessage.classList.add('shake');
                    
                    // Shake animation
                    setTimeout(() => {
                        errorMessage.classList.remove('shake');
                    }, 500);

                    // Clear password field
                    passwordInput.value = '';
                    passwordInput.focus();

                    showToast('Invalid username or password', 'error');
                }
            }

            // ---------- KEYBOARD SHORTCUTS ----------
            // Enter key on password field triggers login
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // Enter key on username field moves to password
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });

            // ---------- EVENT BINDING ----------
            loginForm.addEventListener('submit', handleLogin);

            // ---------- AUTO-FOCUS ----------
            // Focus on username field on load
            window.addEventListener('load', function() {
                usernameInput.focus();
            });

            console.log('✅ Login page ready');

        })();
    </script>
</body>
</html>
